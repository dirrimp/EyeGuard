file_integrity:
  enabled: true
  check_seconds: 300   # config/code edits should be caught within 5 min
  version: "0.3.0"      # must match a version key already published in
                        # release_manifests, or checks log an "unknown
                        # version" warning instead of a tamper flag

# Session/account watcher (root LaunchDaemon, eyeguard/session_watcher.py).
# The main app is a per-user process -- it can only ever see its own user's
# session. If the monitored user (who has full admin) creates a second
# macOS account and switches to it, the original account's EyeGuard keeps
# running and heartbeating "alive" the whole time, completely blind to what
# happens in the other session -- a silent bypass needing no killing, no
# tampering, no uninstall at all. Only root can see across all sessions, so
# this one check stays root-level -- not to protect a secret (it holds
# none, same public api_key as everything else), but because cross-session
# visibility is an OS-level capability no per-user process has, admin or
# not. Flags either a newly-created local user account, or the active
# console session being someone other than expected_user, through the same
# gone-dark-style alert as the main app (see eg_watcher_heartbeat() /
# eg_check_gone_dark()'s new branches in anon_client_pivot.sql).
session_watcher:
  enabled: true
  check_seconds: 120
  expected_user: jonahdirrim

# Find My cross-check (2026-08-31) -- see eyeguard/findmy_watcher.py's own
# docstring for the full reasoning. Credentials are deliberately NOT here
# (this file is git-tracked) -- they live in EyeGuard-data/.findmy_credentials.json
# (chmod 600), written once by `findmy_watcher.py --setup`, which only Jonah
# can run since it needs an interactive 2FA code from his own phone.
findmy:
  enabled: true
  check_seconds: 600
  # Substring match against the device name in Find My (Settings -> [name] ->
  # Find My -> the list under "My Devices"), NOT the AmneziaWG peer name --
  # different system, matched by whatever the phone is actually named there.
  device_name_contains: "iPhone"

# Auto-deploy watcher: polls the public GitHub repo for main's latest
# commit and deploys it the moment it changes -- the merge into main
# (GitHub branch protection + Dad's PR review) is the only approval gate,
# no second one here. Root LaunchDaemon (see deploy/
# com.eyeguard.deploywatcher.plist) -- needs to chown/reset the root-owned
# code tree and restart other daemons. code_dir defaults to the deployed
# tree itself if omitted.
deploy_watcher:
  enabled: true
  check_seconds: 300
  owner: dirrimp
  repo: EyeGuard
  monitored_user: jonahdirrim

# Text + signal layer. The image detector can't see the TEXTUAL side of
# behavior — erotic text, sexual chat, explicit searches — because there's no
# nude image to classify. These two on-device checks close that gap.
text:
  ocr_enabled: true         # OCR the screen (Apple Vision) + flag explicit text
  signals_enabled: true     # flag explicit terms in the URL / window title / search
  ocr_seconds: 8            # OCR at most this often (CPU control)
  ocr_min_terms: 2          # need this many DISTINCT terms in OCR'd text to flag
                            # (one incidental word won't; a porn page easily will)
  # Explicit terms/site names (word-boundary, case-insensitive). Shared by OCR +
  # signal scan. Tune freely — a false yellow is cheap, a miss is the failure.
  terms:
    - porn
    - pornography
    - pornhub
    - xvideos
    - xhamster
    - xnxx
    - redtube
    - youporn
    - brazzers
    - onlyfans
